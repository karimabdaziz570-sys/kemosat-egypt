<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KemoSat | الإدارة</title><style>body{font-family:Tahoma,Arial;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:15px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:27px;display:block}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.blue{background:#0d5bd7;color:#fff}.red{background:#ffe9e9;color:#b42318}input,select{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}}</style></head><body><main class="wrap"><div id="login" class="card"><h1>KemoSat Egypt — لوحة الإدارة</h1><input id="email" placeholder="البريد الإلكتروني"><br><br><input id="pass" type="password" placeholder="كلمة المرور"><br><br><button class="btn blue" onclick="login()">دخول</button><p id="err"></p></div><div id="app" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h1>لوحة التحكم</h1><button class="btn" onclick="logout()">تسجيل الخروج</button></div><div class="grid"><div class="card stat">المنتجات<b id="p">0</b></div><div class="card stat">الطلبات<b id="o">0</b></div><div class="card stat">العملاء<b id="c">0</b></div><div class="card stat">المبيعات<b id="s">0</b></div></div><div class="card"><h2>الطلبات</h2><div id="orders"></div></div><div class="card"><h2>إضافة منتج</h2><div class="grid"><input id="pn" placeholder="اسم المنتج"><input id="pc" placeholder="القسم"><input id="pp" type="number" placeholder="السعر"><input id="ps" type="number" placeholder="المخزون"></div><br><button class="btn blue" onclick="addProduct()">إضافة</button></div></div></main><script>let token=localStorage.getItem('ks_admin');const $=id=>document.getElementById(id);async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('pass').value})});let d=await r.json();if(!r.ok)return $('err').textContent=d.error;localStorage.setItem('ks_admin',d.token);show()}function show(){$('login').style.display='none';$('app').style.display='block';load()}function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(url,opt)}async function load(){let a=await api('/api/admin/stats');if(a.status===401)return logout();let d=await a.json();$('p').textContent=d.products;$('o').textContent=d.orders;$('c').textContent=d.customers;$('s').textContent=Number(d.sales).toLocaleString('ar-EG')+' ج.م';let r=await api('/api/admin/orders');let os=await r.json();$('orders').innerHTML=os.length?`<table><tr><th>الطلب</th><th>العميل</th><th>الإجمالي</th><th>الدفع</th><th>الحالة</th></tr>${os.map(x=>`<tr><td>${x.order_code}</td><td>${x.name}<br>${x.phone}</td><td>${x.total_egp.toLocaleString()} ج.م</td><td>${x.payment_method}</td><td><select onchange="status('${x.id}',this.value)"><option value="new" ${x.status==='new'?'selected':''}>جديد</option><option value="processing" ${x.status==='processing'?'selected':''}>قيد التجهيز</option><option value="shipped" ${x.status==='shipped'?'selected':''}>تم الشحن</option><option value="completed" ${x.status==='completed'?'selected':''}>مكتمل</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>ملغي</option></select></td></tr>`).join('')}</table>`:'لا توجد طلبات.'}async function status(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function addProduct(){let r=await api('/api/admin/products',{method:'POST',body:JSON.stringify({name_ar:$('pn').value,category:$('pc').value,price_egp:+$('pp').value,stock:+$('ps').value})});if(r.ok){$('pn').value='';$('pc').value='';$('pp').value='';$('ps').value='';alert('تمت الإضافة')}else alert((await r.json()).error)}function logout(){localStorage.removeItem('ks_admin');location.reload()}if(token)show()</script></body></html>
